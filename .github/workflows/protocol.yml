name: Verify Pump protocol
on: workflow_dispatch
permissions:
  contents: read
jobs:
  local-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.10.0
          cache: npm
      - run: npm ci
      - name: Install verified Surfpool release
        run: |
          curl --fail --location --retry 3 --output /tmp/surfpool.tar.gz https://github.com/solana-foundation/surfpool/releases/download/v1.5.0/surfpool-linux-x64.tar.gz
          echo '5b20a3b46e60c4f819af7b4da5c3ea211f76041710617841cc23247d15887ddc  /tmp/surfpool.tar.gz' | sha256sum --check
          mkdir -p /tmp/surfpool-bin
          tar -xzf /tmp/surfpool.tar.gz -C /tmp/surfpool-bin
          echo /tmp/surfpool-bin >> "$GITHUB_PATH"
      - name: Simulate protocol and verify signing policy
        run: bash scripts/verify-protocol.sh | tee protocol-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-results
          path: protocol-results.log
