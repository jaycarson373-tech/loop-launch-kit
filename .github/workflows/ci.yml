name: Verify Loop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.10.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run test:vercel
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node --experimental-strip-types scripts/check-vercel-output.ts
      - run: bash scripts/verify-vercel.sh
      - run: npm run build:sites
      - run: bash scripts/verify-api.sh
